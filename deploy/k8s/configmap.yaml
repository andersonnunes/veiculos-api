# Configuração não secreta do veiculos-api. As opções obrigatórias do MinIO (Minio__*) são
# validadas na subida (ValidateOnStart) e não vêm do appsettings.Development, porque o ambiente
# aqui é Production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: veiculos-api-config
  namespace: veiculos
data:
  ASPNETCORE_ENVIRONMENT: Production
  Minio__Endpoint: minio.veiculos.svc.cluster.local:9000
  Minio__Bucket: veiculos-fotos
  Minio__Secure: "false"
  VendasApi__BaseUrl: http://vendas-api.vendas.svc.cluster.local:8080
