# Credenciais de dev do ambiente efêmero do CD (kind). Não são segredos de produção.
apiVersion: v1
kind: Secret
metadata:
  name: veiculos-api-secret
  namespace: veiculos
type: Opaque
stringData:
  ConnectionStrings__VeiculosDb: Host=veiculos-db;Port=5432;Database=veiculos;Username=veiculos;Password=veiculos
  Minio__AccessKey: minioadmin
  Minio__SecretKey: minioadmin
---
apiVersion: v1
kind: Secret
metadata:
  name: veiculos-db-secret
  namespace: veiculos
type: Opaque
stringData:
  POSTGRES_DB: veiculos
  POSTGRES_USER: veiculos
  POSTGRES_PASSWORD: veiculos
