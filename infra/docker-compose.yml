# Ambiente de desenvolvimento local deste repositório, isolado do vendas-api.
# Rodar a partir da raiz do repositório: docker compose -f infra/docker-compose.yml up --build
#
# Banco próprio (veiculos-db) — nenhuma conexão de código ainda (nasce junto do Épico 1, que
# adiciona o CRUD de veículo); aqui só garante que o serviço e o banco sobem juntos desde já.
name: veiculos-api

services:
  veiculos-api:
    build:
      context: ..
      dockerfile: src/VeiculosApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Credenciais de dev do próprio veiculos-db abaixo — ambiente local efêmero, não é
      # segredo de produção.
      - ConnectionStrings__VeiculosDb=Host=veiculos-db;Port=5432;Database=veiculos;Username=veiculos;Password=veiculos
      # Dentro da rede do compose o Keycloak responde por `keycloak`; o emissor público
      # (localhost:8180) continua sendo o que o token carrega no claim `iss`.
      - Keycloak__MetadataInterna=http://keycloak:8080/realms/revendax/.well-known/openid-configuration
      - Keycloak__EndpointToken=http://keycloak:8080/realms/revendax/protocol/openid-connect/token
    ports:
      - "5001:8080"
    depends_on:
      veiculos-db:
        condition: service_healthy
      keycloak:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      # Credenciais de dev do admin do Keycloak local — não é segredo de produção.
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_HOSTNAME=http://localhost:8180
      # O emissor do token continua o público (localhost:8180), mas as URLs de backchannel
      # (jwks_uri, token) seguem o host da requisição: a API, dentro da rede do compose, busca
      # as chaves em keycloak:8080, que é alcançável de dentro do container.
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-revendax.json:/opt/keycloak/data/import/realm-revendax.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  veiculos-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=veiculos
      - POSTGRES_USER=veiculos
      - POSTGRES_PASSWORD=veiculos
    ports:
      - "5433:5432"
    volumes:
      - veiculos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veiculos -d veiculos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  veiculos-db-data:
  keycloak-db-data:
